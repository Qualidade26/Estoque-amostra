  .chips{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
  .chip{border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 12px; cursor:pointer; font-size:12.5px; font-weight:600; color:#46525f;}
  .chip.ativo{background:var(--navy-800); border-color:var(--navy-800); color:#fff;}
  .busca{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
  .abas{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .abas button{background:none; border:none; padding:10px 14px; font-weight:700; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; font-size:13.5px;}
  .abas button.ativo{color:var(--navy-800); border-bottom-color:var(--blue-accent);}

  /* ---------------- Lançamento (celular) ---------------- */
  .lanc{max-width:560px; margin:0 auto;}
  .lanc .campo input{font-size:17px; padding:13px 14px;}
  .lanc .campo label{font-size:13px;}
  .desc-sku{min-height:22px; margin-top:6px; font-size:14.5px; font-weight:600; color:var(--navy-800);}
  .desc-sku.nao{color:var(--warn); font-weight:600;}
  .seg{display:flex; background:#eef2f8; border-radius:9px; padding:3px;}
  .seg button{flex:1; border:none; background:none; padding:9px; border-radius:7px; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .seg button.ativo{background:#fff; color:var(--navy-800); box-shadow:0 1px 3px rgba(11,37,69,0.12);}
  .qtd-in{font-size:30px !important; font-weight:800; text-align:center;}
  .badge-rod{background:var(--navy-800); color:#fff; border-radius:20px; padding:4px 12px; font-size:12.5px; font-weight:700;}
  .conf-tab td{padding:9px 6px; font-size:15px;} .conf-tab td:first-child{color:var(--muted); width:42%;}
  .item-rec{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .item-rec:last-child{border-bottom:none;}

  /* ---------------- Modal / toast ---------------- */
  #modal{position:fixed; inset:0; background:rgba(8,20,56,.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:14px;}
  .modal-box{background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:92vh; overflow:auto; padding:22px; box-shadow:0 24px 60px rgba(5,15,40,0.40);}
  .modal-box.largo{max-width:960px;}
  .modal-box h3{font-size:17px;}
  .modal-acoes{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
  #toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy-900); color:#fff; padding:12px 18px; border-radius:10px; z-index:90; font-size:14px; max-width:92vw; box-shadow:0 6px 20px rgba(0,0,0,.25);}
  #toast.erro{background:var(--err);} #toast.ok{background:var(--ok);}
  .arquivo{border:1px dashed #b7c6da; border-radius:10px; padding:10px 12px; margin-top:10px; background:#fafcff; font-size:13px;}

  /* ---------------- Tela de acesso (igual ao painel da Logística) ---------------- */
  .auth-screen{position:fixed; inset:0; z-index:100; background:#2850f0; overflow:auto;}
  .auth-screen .auth-bg{position:absolute; top:0; right:0; bottom:0; width:min(58%,760px); overflow:hidden; pointer-events:none;}
  .auth-screen .auth-bg img{height:100%; width:100%; object-fit:cover; object-position:left center;}
  .auth-screen .auth-bg::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(40,80,240,1) 0%, rgba(40,80,240,0.55) 22%, rgba(8,20,56,0.10) 55%, rgba(8,20,56,0.25) 100%);}
  .auth-layout{position:relative; z-index:2; min-height:100%; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:28px; padding:40px clamp(24px, 6vw, 90px);}
  .auth-logo{display:block; width:min(340px, 75vw); height:auto; margin-left:-8px;}
  .auth-card{position:relative; z-index:2; width:100%; max-width:380px; background:#fff; border-radius:16px; padding:26px 28px 20px 28px; box-shadow:0 24px 60px rgba(5,15,40,0.40);}
  .auth-card h2{margin:0 0 4px 0; font-size:17px; color:var(--navy-800);}
  .auth-card .auth-sub{margin:0 0 16px 0; font-size:12px; color:var(--muted);}
  .auth-card label{display:block; font-size:12px; font-weight:600; color:var(--navy-800); margin:10px 0 4px 0;}
  .auth-card input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
  .auth-card input:focus{outline:none; border-color:var(--blue-accent); box-shadow:0 0 0 3px rgba(47,125,225,0.15);}
  .auth-card label.lembrar{display:flex; align-items:center; gap:8px; font-weight:500; color:var(--ink); margin:12px 0 0 0; cursor:pointer; font-size:12.5px;}
  .auth-card label.lembrar input{width:16px; height:16px; margin:0; padding:0; accent-color:var(--blue-accent);}
  .auth-card .btn{width:100%; margin-top:16px; padding:11px;}
  .auth-card .btn.auth-sec{margin-top:10px; background:#fff; color:var(--navy-800); border:1px solid var(--line);}
  .auth-card .btn.auth-sec:hover{background:#f5f8fc;}
  .auth-msg{font-size:12.5px; margin-top:12px; line-height:1.5; min-height:1em;}
  .auth-msg.err{color:var(--err);} .auth-msg.ok{color:var(--ok);}

  @media (max-width:900px){
    .auth-screen .auth-bg{width:100%; opacity:.35;}
    .auth-layout{align-items:center; padding:30px 16px;}
    .auth-logo{margin-left:0;}
    .hero-overlay{padding:32px 24px;} .hero-title{font-size:26px;}
  }
  @media (max-width:760px){
    .sidebar{transform:translateX(-100%); width:var(--sidebar-w) !important;}
    .sidebar.aberta{transform:none;}
    .sidebar .collapse-btn{display:none;}
    .main,.sidebar.collapsed ~ .main{margin-left:0;}
    .hamb{display:block;}
    body.so-contagem .hamb{display:none;}
    .backdrop.on{display:block; position:fixed; inset:0; background:rgba(8,20,56,.45); z-index:35;}
    .topbar{padding:10px 12px; flex-wrap:wrap;}
    .topbar-right .data,.topbar-right #dbDiag{display:none;}
    .page{padding:16px 12px 40px;}
    .kpi .val{font-size:23px;}
    .user-chip .nome-u{max-width:110px; overflow:hidden; text-overflow:ellipsis;}
  }
  #print-area{display:none;}
  @media print{
    body{display:block; background:#fff;}
    .sidebar,.main,#modal,#toast,.auth-screen,.backdrop{display:none !important;}
    #print-area{display:block;}
    .pg{page-break-after:always;} .pg:last-child{page-break-after:auto;}
    #print-area table{font-size:9.5px;} #print-area th{position:static;}
    #print-area tr.r-ok td{background:#e6f5ec !important;} #print-area tr.r-neg td{background:#fdecea !important;}
    #print-area tr.r-pos td{background:#e7f0fd !important;} #print-area tr.r-rec td{background:#fff3e2 !important;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    @page{size:A4 landscape; margin:10mm;}
  }
</style>
</head>

<script>
/* =====================================================================
   BASE
   ===================================================================== */
const CFG = window.INV_CONFIG;
const LOGO = document.querySelector('.auth-logo').src, FUNDO = document.querySelector('.auth-bg img').src;
const armazem = {   // "Lembrar meu login": localStorage; senão só até fechar o navegador
  getItem(k){ try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  setItem(k,v){ try { (localStorage.getItem('inv-lembrar') === '0' ? sessionStorage : localStorage).setItem(k,v); } catch {} },
  removeItem(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} }
};
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth:{ storage:armazem, persistSession:true, autoRefreshToken:true } });

const S = { base:[], produtos:new Map(), baseOk:false, bBase:'', pgBase:0, perfil:null, invs:[], invId:null, itens:[], lanc:[], catalogo:new Map(), recontar:[], meus:[],
            pagina:null, canal:null, fRel:'todos', bRel:'', pgRel:0, abaRel:'itens', bItens:'', pgItens:0, imp:null,
            form:{ tipo:'V' } };
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vazio = v => v === null || v === undefined || v === '';
const num = v => vazio(v) ? null : Number(v);
const arred = x => Math.round(x * 1000) / 1000;
const fmtN = v => vazio(v) ? '' : Number(v).toLocaleString('pt-BR', {maximumFractionDigits:3});
const fmtPct = v => (v * 100).toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
const fmtData = d => { if (!d) return ''; const [a,m,dd] = String(d).slice(0,10).split('-'); return `${dd}/${m}/${a}`; };
const fmtDH = d => d ? new Date(d).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
const slugLogin = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9._@-]/g,'');
const emailDe = login => { const l = slugLogin(login); return l.includes('@') ? l : `${l}@${CFG.dominio}`; };
const isAdmin = () => S.perfil?.perfil === 'admin';
const invAtual = () => S.invs.find(i => i.id === S.invId);
const NOME_PERFIL = { admin:'Administrador', contador:'Contagem' };

function toast(msg, tipo='') {
  const t = $('toast'); t.textContent = msg; t.className = tipo; t.hidden = false; clearTimeout(t._h);
  t._h = setTimeout(() => t.hidden = true, tipo === 'erro' ? 5500 : 2800);
}
function erroMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Usuário ou senha incorretos.';
  if (/Password should be at least|weak password/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  return m.replace(/^.*?ERROR:\s*/,'');
}
function abrirModal(html, largo=false) {
  $('modalBox').className = 'modal-box' + (largo ? ' largo' : ''); $('modalBox').innerHTML = html; $('modal').hidden = false;
  const f = $('modalBox').querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 60);
}
function fecharModal() { $('modal').hidden = true; $('modalBox').innerHTML = ''; }
$('modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') fecharModal(); });
function confirmar(msg, txtOk='Confirmar', perigo=false) {
  return new Promise(res => {
    abrirModal(`<h3>Confirmação</h3><div style="font-size:14px;line-height:1.5">${msg}</div><div class="modal-acoes">
      <button class="btn secondary" id="cfN">Cancelar</button><button class="btn ${perigo?'perigo':''}" id="cfS">${esc(txtOk)}</button></div>`);
    $('cfN').onclick = () => { fecharModal(); res(false); };
    $('cfS').onclick = () => { fecharModal(); res(true); };
  });
}
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch {} }

/* =====================================================================
   REGRAS (iguais às da planilha de inventário)
   ===================================================================== */
const temTransf = it => !vazio(it.transf_local) && String(it.transf_local).trim() !== '';
function proxRodada(it) {
  if (temTransf(it)) return 0;
  const s = Number(it.sistema), c1 = num(it.c1), c2 = num(it.c2), c3 = num(it.c3), c4 = num(it.c4);
  if (c1 === null) return 1; if (c1 === s) return 0;
  if (c2 === null) return 2; if (c2 === s || c2 === c1) return 0;
  if (c3 === null) return 3; if (c3 === s || c3 === c1 || c3 === c2) return 0;
  if (c4 === null) return 4; return 0;
}
function precisaRodada(it, k) {
  if (temTransf(it)) return false; if (k === 1) return true;
  if (Number(it.reaberto_rodada) === k) return true;
  return proxRodada({ ...it, c2:k>2?it.c2:null, c3:k>3?it.c3:null, c4:null }) === k;
}
function calc(it) {
  const p = proxRodada(it), tr = temTransf(it), fechado = invAtual()?.status === 'encerrado';
  const fin = num(it.c4) ?? num(it.c3) ?? num(it.c2) ?? num(it.c1);
  const dif = fin === null ? null : arred(fin - Number(it.sistema));
  const concluido = tr || (fin !== null && (p === 0 || fechado));
  const emRec = !concluido && fin !== null;
  const status = tr ? 'TRANSFERÊNCIA' : fin === null ? 'NÃO CONTADO' : emRec ? `${p}ª CONTAGEM`
    : p !== 0 ? 'SEM RECONTAGEM' : dif === 0 ? 'OK' : 'CONFIRMADO';
  const disp = fin === null ? '' : tr ? 'TRANSFERÊNCIA' : dif === 0 ? 'OK' : dif < 0 ? 'AJ.NEGATIVO' : 'AJ.POSITIVO';
  const cls = tr ? 'r-tr' : fin === null ? '' : emRec ? 'r-rec' : dif === 0 ? 'r-ok' : dif < 0 ? 'r-neg' : 'r-pos';
  return { prox:p, status, dif, disp, concluido, emRec, cls, final: fin === null ? null : arred(Number(it.sistema) + dif),
           diverg: fin === null ? null : dif !== 0, recontado: [it.c2,it.c3,it.c4].some(v => !vazio(v)) };
}
function tagStatus(c) {
  const cls = { 'r-ok':'t-ok', 'r-neg':'t-neg', 'r-pos':'t-pos', 'r-rec':'t-rec', 'r-tr':'t-tr' }[c.cls] || 't-pend';
  return `<span class="tag ${cls}">${esc(c.status)}</span>`;
}
function tagDisp(d) {
  if (!d) return '';
  const cls = d === 'OK' ? 't-ok' : d === 'AJ.NEGATIVO' ? 't-neg' : d === 'AJ.POSITIVO' ? 't-pos' : 't-tr';
  return `<span class="tag ${cls}">${esc(d)}</span>`;
}
function estatisticas() {
  const itens = S.itens, inv = invAtual();
  const r = { total:itens.length, extras:0, linhas:[itens.length,0,0,0], cont:[0,0,0,0], concl:0, pos:0, neg:0, tr:0, ok:0,
              qPos:0, qNeg:0, naoCont:0, emRec:0, pessoas:{} };
  const porId = new Map(itens.map(i => [i.id, i]));
  for (const it of itens) {
    const c = calc(it), s = Number(it.sistema), c1 = num(it.c1), c2 = num(it.c2), c3 = num(it.c3), tr = temTransf(it);
    if (it.extra) r.extras++;
    ['c1','c2','c3','c4'].forEach((k,i) => { if (!vazio(it[k])) r.cont[i]++; });
    if (!tr && c1 !== null && c1 !== s) r.linhas[1]++;
    if (!tr && c2 !== null && c2 !== s && c2 !== c1) r.linhas[2]++;
    if (!tr && c3 !== null && c3 !== s && c3 !== c1 && c3 !== c2) r.linhas[3]++;
    if (tr) r.tr++;
    if (c.status === 'NÃO CONTADO') r.naoCont++;
    if (c.emRec) r.emRec++;
    if (c.concluido) {
      r.concl++;
      if (c.disp === 'AJ.POSITIVO') { r.pos++; r.qPos += c.dif; }
      else if (c.disp === 'AJ.NEGATIVO') { r.neg++; r.qNeg += c.dif; }
      else if (c.disp === 'OK') r.ok++;
    }
  }
  // por pessoa (a partir dos lançamentos)
  const vistos = new Set();
  for (const l of S.lanc) {
    if (l.cancelado) continue;
    const p = (r.pessoas[l.por || '—'] ??= { lanc:[0,0,0,0], itens:0, div:0 });
    p.lanc[l.rodada - 1]++;
    const chave = (l.por||'') + '|' + l.item_id + '|' + l.rodada;
    if (l.item_id && !vistos.has(chave)) {
      vistos.add(chave); p.itens++;
      const it = porId.get(l.item_id);
      if (it && !vazio(it['c'+l.rodada]) && Number(it['c'+l.rodada]) !== Number(it.sistema)) p.div++;
    }
  }
  r.acur = r.concl ? (r.concl - r.pos - r.neg) / r.concl : 0;
  r.pctContado = r.total ? (r.total - r.naoCont) / r.total : 0;
  return r;
}

/* =====================================================================
   ACESSO
   ===================================================================== */
$('loginLembrar').checked = lsGet('inv-lembrar') !== '0';
$('formLogin').onsubmit = async e => {
  e.preventDefault();
  const msg = $('authMsg'); msg.className = 'auth-msg'; msg.textContent = '';
  lsSet('inv-lembrar', $('loginLembrar').checked ? '1' : '0');
  $('btnEntrar').disabled = true; $('btnEntrar').textContent = 'Entrando...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email:emailDe($('loginUsuario').value), password:$('loginSenha').value });
    if (error) throw error;
    await iniciarSessao(data.user);
  } catch (err) { msg.className = 'auth-msg err'; msg.textContent = erroMsg(err); }
  $('btnEntrar').disabled = false; $('btnEntrar').textContent = 'Entrar';
};
$('btnEsqueci').onclick = () => { const m = $('authMsg'); m.className = 'auth-msg'; m.textContent = 'Peça ao administrador do inventário para cadastrar uma nova senha para você.'; };

async function iniciarSessao(user) {
  const { data:p, error } = await sb.from('inv_perfis').select('*').eq('id', user.id).maybeSingle();
  if (error) throw error;
  if (!p) { await sb.auth.signOut(); throw new Error('Usuário sem acesso ao inventário.'); }
  if (!p.ativo) { await sb.auth.signOut(); throw new Error('Usuário bloqueado. Fale com o administrador.'); }
  S.perfil = p;
  $('uNome').textContent = p.nome; $('uPerfil').textContent = NOME_PERFIL[p.perfil];
  $('authScreen').hidden = true; $('main').hidden = false; $('loginSenha').value = '';
  $('sidebar').hidden = false;
  montarMenu();
  await carregarInventarios();
  irPara('inicio');
}
$('btnSair').onclick = async () => { if (S.canal) sb.removeChannel(S.canal); await sb.auth.signOut(); location.reload(); };
$('btnSenha').onclick = () => {
  abrirModal(`<h3>Alterar minha senha</h3>
    <div class="campo"><label>Nova senha</label><input type="password" id="ns1" autofocus></div>
    <div class="campo" style="margin-top:10px"><label>Repita a nova senha</label><input type="password" id="ns2"></div>
    <div class="modal-acoes"><button class="btn secondary" onclick="fecharModal()">Cancelar</button><button class="btn" id="nsOk">Salvar</button></div>`);
  $('nsOk').onclick = async () => {
    const a = $('ns1').value, b = $('ns2').value;
    if (a.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', 'erro');
    if (a !== b) return toast('As senhas não conferem.', 'erro');
    const { error } = await sb.auth.updateUser({ password:a });
    if (error) return toast(erroMsg(error), 'erro');
    fecharModal(); toast('Senha alterada.', 'ok');
  };
};

/* =====================================================================
   DADOS
   ===================================================================== */
async function buscarTodos(tabela, invId) {
  let out = [], de = 0; const passo = 1000;
  for (;;) {
    const { data, error } = await sb.from(tabela).select('*').eq('inventario_id', invId).order('id', {ascending:true}).range(de, de + passo - 1);
    if (error) throw error;
    out = out.concat(data); if (data.length < passo) break; de += passo;
  }
  return out;
}
async function carregarInventarios(manterId) {
  const { data, error } = await sb.from('inv_inventarios').select('*').order('criado_em', {ascending:false});
  if (error) { diag(false); return toast(erroMsg(error), 'erro'); }
  diag(true);
  S.invs = data || [];
  let id = manterId ?? S.invId ?? Number(lsGet('inv-atual'));
  if (!isAdmin()) id = (S.invs.find(i => i.id === id && i.status === 'aberto') || S.invs.find(i => i.status === 'aberto'))?.id ?? null;
  else if (!S.invs.some(i => i.id === id)) id = (S.invs.find(i => i.status === 'aberto') || S.invs[0])?.id ?? null;
  await selecionarInventario(id, false);
}
async function selecionarInventario(id, redesenhar = true) {
  S.invId = id; lsSet('inv-atual', id ?? '');
  S.itens = []; S.lanc = []; S.pgRel = 0; S.pgItens = 0;
  await recarregarDados();
  assinarTempoReal();
  if (redesenhar && S.pagina) desenhar();
}
async function recarregarDados() {
  const id = S.invId; if (!id) return;
  try {
    if (isAdmin()) [S.itens, S.lanc] = await Promise.all([buscarTodos('inv_itens', id), buscarTodos('inv_lancamentos', id)]);
    await dadosContagem();
    diag(true);
  } catch (e) { diag(false); toast(erroMsg(e), 'erro'); }
}
async function dadosContagem() {
  const id = S.invId; if (!id) return;
  const [cat, rec, meus] = await Promise.all([
    sb.rpc('inv_catalogo', { p_inv:id }),
    sb.rpc('inv_lista_recontagem', { p_inv:id }),
    sb.from('inv_lancamentos').select('*').eq('inventario_id', id).eq('por_id', S.perfil.id).order('id', {ascending:false}).range(0, 499)
  ]);
  for (const r of [cat, rec, meus]) if (r.error) throw r.error;
  S.catalogo = new Map((cat.data || []).map(c => [norm(c.codigo), c]));
  S.recontar = rec.data || []; S.meus = meus.data || [];
}
function diag(ok) { const d = $('dbDiag'); d.className = ok ? 'db-ok' : 'db-err'; d.textContent = window.supabase.__teste ? 'modo teste · dados só neste navegador' : ok ? 'banco conectado' : 'sem conexão com o banco'; }

function assinarTempoReal() {
  if (S.canal) { sb.removeChannel(S.canal); S.canal = null; }
  if (!S.invId || !isAdmin()) return;
  const f = `inventario_id=eq.${S.invId}`;
  S.canal = sb.channel('inv-' + S.invId)
    .on('postgres_changes', {event:'*', schema:'public', table:'inv_itens', filter:f}, p => mudanca('itens', p))
    .on('postgres_changes', {event:'*', schema:'public', table:'inv_lancamentos', filter:f}, p => mudanca('lanc', p))
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'inv_inventarios', filter:`id=eq.${S.invId}`}, p => {
        const i = S.invs.findIndex(x => x.id === p.new.id); if (i >= 0) S.invs[i] = p.new; agendar(); })
    .subscribe();
}
function mudanca(lista, p) {
  const arr = S[lista];
  if (p.eventType === 'DELETE') { const i = arr.findIndex(x => x.id === p.old.id); if (i >= 0) arr.splice(i, 1); }
  else { const i = arr.findIndex(x => x.id === p.new.id); if (i >= 0) arr[i] = p.new; else arr.push(p.new); }
  agendar();
}
function agendar() { clearTimeout(S._rt); S._rt = setTimeout(atualizarDados, 400); }
function trocarItem(novo) { const i = S.itens.findIndex(x => x.id === novo.id); if (i >= 0) S.itens[i] = novo; else S.itens.push(novo); }
// atualização automática: administrador por tempo real + conferência a cada 60 s; quem conta a cada 20 s
setInterval(async () => {
  if (!S.perfil || document.visibilityState !== 'visible' || !$('modal').hidden) return;
  if (isAdmin()) { await recarregarDados(); atualizarDados(); }
  else { const antes = invAtual()?.rodada; await carregarInventariosSilencioso(); if (invAtual()?.rodada !== antes) desenhar(); else atualizarDados(); }
}, 20000);
async function carregarInventariosSilencioso() {
  const { data } = await sb.from('inv_inventarios').select('*').order('criado_em', {ascending:false});
  if (data) S.invs = data;
  if (!isAdmin() && !S.invs.some(i => i.id === S.invId && i.status === 'aberto')) S.invId = S.invs.find(i => i.status === 'aberto')?.id ?? null;
  try { await dadosContagem(); } catch {}
}

/* =====================================================================
   MENU
   ===================================================================== */
const PAGINAS = {
  inicio:   { ico:'🏠', nome:'Início',     titulo:'Início',      sub:'Acompanhamento do inventário' },
  base:       { ico:'🗄️', nome:'Base de dados', titulo:'Base de dados', sub:'Relatório de saldo do sistema · armazém 11 – Amostras' },
  inventarios:{ ico:'📋', nome:'Abrir inventário', titulo:'Abrir inventário', sub:'Abrir o inventário a partir da base e acompanhar os itens' },
  contagem:   { ico:'🔢', nome:'Contagem',   titulo:'Contagem',    sub:'Lançamento da contagem' },
  relatorio:{ ico:'📊', nome:'Relatório',  titulo:'Relatório',   sub:'Confronto da contagem com o sistema' },
  exportar: { ico:'📥', nome:'Exportar',   titulo:'Exportar',    sub:'Finalizar o inventário e baixar a planilha em Excel' },
  usuarios: { ico:'👥', nome:'Usuários',   titulo:'Usuários',    sub:'Cadastro de quem acessa o inventário' },
};
function montarMenu() {

        return `<tr class="${c ? c.cls : ''}"><td>${fmtDH(l.em)}</td><td>${esc(l.por)}</td><td>${l.rodada}ª</td><td><b>${esc(l.codigo)}</b></td><td>${esc(l.descricao)}</td>

async function avancarRodada() {
  const inv = invAtual(), k = inv.rodada;
  const falta = S.itens.filter(it => precisaRodada(it, k) && vazio(it['c'+k])).length;
  if (!await confirmar(`Encerrar a <b>${k}ª contagem</b>?${falta ? `<br><br><b>${falta}</b> itens não foram lançados e ficarão ${k === 1 ? 'como <b>não encontrados (0)</b>' : 'com a última contagem (<b>sem recontagem</b>)'}.` : ''}<br><br>Os itens com divergência vão para a ${k+1}ª contagem.`, 'Encerrar contagem')) return;
  const { data, error } = await sb.rpc('inv_avancar_rodada', { p_inv:inv.id });
  if (error) return toast(erroMsg(error), 'erro');
  await carregarInventarios(inv.id);
  if (data > 0) toast(`${k+1}ª contagem liberada para ${data} itens.`, 'ok');
  else { toast('Nenhum item com divergência. Pode finalizar o inventário.', 'ok'); }
  desenhar();
}

/* =====================================================================
   INVENTÁRIO — LANÇAMENTO DA CONTAGEM (todos)
   ===================================================================== */
function pContagem() {
  const inv = invAtual();
  if (!inv || inv.status !== 'aberto') {
    $('view').innerHTML = `<div class="page"><div class="lanc">${isAdmin() ? `<div class="linha" style="margin-bottom:14px">${seletorInventario()}</div>` : ''}
      ${!inv ? semInventario() : '<div class="card vazio">Este inventário está finalizado.</div>'}</div></div>`;
    ligarSeletor(); return;
  }
  const f = S.form;
  $('view').innerHTML = `<div class="page"><div class="lanc">
    ${isAdmin() && S.invs.filter(i => i.status === 'aberto').length > 1 ? `<div class="linha" style="margin-bottom:12px">${seletorInventario()}</div>` : ''}
    <div class="card">
      <div class="linha entre" style="margin-bottom:12px"><h3 style="margin:0">Lançar contagem</h3><span id="cabRodada"></span></div>
      <div class="campo"><label>SKU</label><input id="fSku" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Digite ou bipe o SKU" value="${esc(f.sku||'')}"></div>
      <div class="desc-sku" id="fDesc"></div>
      <div class="campo" id="boxDescManual" hidden style="margin-top:6px"><label>Descrição do produto</label><input id="fDescManual" value="${esc(f.descManual||'')}"></div>
      <div class="campo" style="margin-top:12px"><label>Lote</label><input id="fLote" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(f.lote||'')}"></div>
      <div class="campo" style="margin-top:12px"><label>Data</label>
        <div class="seg" id="fTipo"><button type="button" data-t="V">Validade</button><button type="button" data-t="F">Fabricação</button></div>
        <input type="date" id="fData" style="margin-top:6px" value="${esc(f.data||'')}"></div>
      <div class="campo" style="margin-top:12px"><label>Quantidade</label><input id="fQtd" class="qtd-in" type="number" inputmode="decimal" step="any" min="0" value="${esc(f.qtd||'')}"></div>
      <button class="btn grande" id="fContinuar" style="width:100%;margin-top:16px">Continuar</button>
    </div>
    <div class="card" id="cardRecontar" hidden><h3 id="titRecontar"></h3><div class="peq" style="margin-bottom:6px">Conte de novo estes itens e lance normalmente (SKU, lote, data e quantidade).</div><div id="listaRecontar"></div></div>
    <div class="card"><h3>Meus lançamentos</h3><div id="listaMeus"></div></div>
  </div></div>`;
  ligarSeletor();
  const sku = $('fSku');
  sku.oninput = () => { f.sku = sku.value; mostrarDescricao(); };
  sku.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('fLote').focus(); } };
  $('fLote').oninput = e => f.lote = e.target.value;
  $('fLote').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('fData').focus(); } };
  $('fDescManual').oninput = e => f.descManual = e.target.value;
  $('fData').onchange = e => f.data = e.target.value;
  $('fQtd').oninput = e => f.qtd = e.target.value;
  $('fQtd').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); revisar(); } };
  $('fTipo').querySelectorAll('button').forEach(b => b.onclick = () => { f.tipo = b.dataset.t; marcarTipo(); });
  $('fContinuar').onclick = revisar;
  marcarTipo(); mostrarDescricao(); cabecalhoRodada(); listaRecontar(); listaMeus();
  if (!f.sku) setTimeout(() => sku.focus(), 80);
}
function marcarTipo() { $('fTipo')?.querySelectorAll('button').forEach(b => b.classList.toggle('ativo', b.dataset.t === S.form.tipo)); }
function cabecalhoRodada() { const el = $('cabRodada'); if (el) el.innerHTML = `<span class="badge-rod">${invAtual()?.rodada || 1}ª contagem</span>`; }
function mostrarDescricao() {
  const el = $('fDesc'); if (!el) return;
  const cod = norm(S.form.sku);
  if (!cod) { el.textContent = ''; el.className = 'desc-sku'; $('boxDescManual').hidden = true; return; }
  const c = S.catalogo.get(cod);
  if (c) { el.textContent = c.descricao || '(sem descrição)'; el.className = 'desc-sku'; $('boxDescManual').hidden = true; }
  else if (invAtual()?.tipo === 'parcial') { el.textContent = 'Este SKU não faz parte deste inventário. Confira o código.'; el.className = 'desc-sku nao'; $('boxDescManual').hidden = true; }
  else { el.textContent = 'SKU não encontrado no relatório. Confira o código ou informe a descrição abaixo.'; el.className = 'desc-sku nao'; $('boxDescManual').hidden = false; }
}
function revisar() {
  const f = S.form, cod = (f.sku || '').trim(), lote = (f.lote || '').trim(), qtd = String(f.qtd ?? '').replace(',', '.').trim();
  const cat = S.catalogo.get(norm(cod));
  if (!cod) return toast('Informe o SKU.', 'erro'), $('fSku').focus();
  if (!cat && invAtual()?.tipo === 'parcial') return toast('Este SKU não faz parte deste inventário.', 'erro'), $('fSku').focus();
  if (!cat && !(f.descManual||'').trim()) return toast('SKU não está no relatório: informe a descrição.', 'erro'), $('fDescManual').focus();
  if (!lote) return toast('Informe o lote.', 'erro'), $('fLote').focus();
  if (!f.data) return toast(`Informe a data de ${f.tipo === 'V' ? 'validade' : 'fabricação'}.`, 'erro'), $('fData').focus();
  if (qtd === '' || isNaN(Number(qtd)) || Number(qtd) < 0) return toast('Informe a quantidade.', 'erro'), $('fQtd').focus();
  const desc = cat ? cat.descricao : f.descManual.trim();
  abrirModal(`<h3>Confira o lançamento</h3>
    <table class="conf-tab"><tbody>
      <tr><td>Contagem</td><td><b>${invAtual().rodada}ª</b></td></tr>
      <tr><td>SKU</td><td><b>${esc(cod)}</b></td></tr>
      <tr><td>Descrição</td><td>${esc(desc)}${cat ? '' : ' <span class="tag t-rec">não listado</span>'}</td></tr>
      <tr><td>Lote</td><td><b>${esc(lote)}</b></td></tr>
      <tr><td>${f.tipo === 'V' ? 'Validade' : 'Fabricação'}</td><td><b>${fmtData(f.data)}</b></td></tr>
      <tr><td>Quantidade</td><td><b style="font-size:24px">${fmtN(Number(qtd))}</b></td></tr>
    </tbody></table>
    <div class="modal-acoes"><button class="btn secondary" onclick="fecharModal()">Corrigir</button>
      <button class="btn verde grande" id="btnConfirmar" autofocus>Confirmar e salvar</button></div>`);
  $('btnConfirmar').onclick = async () => {
    $('btnConfirmar').disabled = true; $('btnConfirmar').textContent = 'Salvando...';
    const { data, error } = await sb.rpc('inv_lancar', { p_inv:S.invId, p_codigo:cod, p_lote:lote, p_tipo_data:f.tipo, p_data:f.data,
      p_qtd:Number(qtd), p_descricao:cat ? null : desc });
    if (error) { fecharModal(); toast(erroMsg(error), 'erro'); return; }
    fecharModal();
    toast(data?.extra ? 'Salvo como item não listado no relatório.' : 'Lançamento salvo.', 'ok');
    S.form = { tipo:f.tipo };
    try { await dadosContagem(); } catch {}
    if (isAdmin()) await recarregarDados();
    pContagem();
  };
}
function listaRecontar() {
  const card = $('cardRecontar'); if (!card) return;
  const k = invAtual()?.rodada || 1;
  card.hidden = k === 1 || !S.recontar.length; if (card.hidden) return;

/* ---------- leitura dos arquivos / texto colado ---------- */
const MAPA = {
  codigo:    ['PRODUTO','SKU','CODIGO','COD','COD.','COD PRODUTO','CODIGO PRODUTO','ITEM'],
  descricao: ['DESCRICAO','DESCRICAO PRODUTO','DESC','DESC.','NOME','DESC. PRODUTO'],
  lote:      ['LOTE'],
  validade:  ['DATA VALIDAD','DATA VALIDADE','DT VALIDADE','DT. VALIDADE','VALIDADE','VAL.','VAL','VENCIMENTO'],
  fabricacao:['DATA FABRIC','DATA FABRICACAO','DT FABRICACAO','DT. FABRICACAO','FABRICACAO','DT FABRIC'],
  data:      ['DATA','DATA ENTRADA','DT ENTRADA'],
  sistema:   ['SALDO LOTE','SALDO 1A.U.M.','SALDO 1A UM','SALDO','SISTEMA','QUANTIDADE','QTD','QTDE','ESTOQUE','SALDO ATUAL'],
  empenho:   ['EMP. DO LOTE','EMPENHO 1A.U.M.','EMPENHO','EMP. LOTE'],
  armazem:   ['ARMAZEM','ARMZ.','ARMZ','ARM','LOCAL ESTOQUE'],
  empresa:   ['FILIAL','EMP.','EMP','EMPRESA'],
};
function detectarCabecalho(linhas, soDescricao) {
  for (let r = 0; r < Math.min(60, linhas.length); r++) {
    const cab = (linhas[r] || []).map(norm), col = {};
    for (const [campo, nomes] of Object.entries(MAPA)) {
      for (const n of nomes) { const i = cab.indexOf(n); if (i >= 0) { col[campo] = i; break; } }
    }
    if (col.codigo !== undefined && (col.sistema !== undefined || (soDescricao && col.descricao !== undefined))) {
      const outras = cab.map((c,i) => c === 'DESCRICAO' ? i : -1).filter(i => i >= 0 && i !== col.descricao);
      if (outras.length) col.armazemNome = outras[outras.length - 1];   // 2ª "Descricao" = nome do armazém (VENDAS, AMOSTRAS...)
      return { linha:r, col, cab };
    }
  }
  return null;
}
function dataISO(v) {
  if (vazio(v)) return null;
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}` : null; }
  if (v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { const a = m[3].length === 2 ? '20'+m[3] : m[3]; return `${a}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function numero(v) {
  if (vazio(v)) return 0; if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s/g,'');
  if (s === '-' || s === '') return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');      // 37.754,00 → 37754.00
  const n = Number(s); return isNaN(n) ? 0 : n;
}
function textoParaLinhas(txt) {
  txt = txt.replace(/^﻿/, '');
  const primeira = txt.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = primeira.includes('\t') ? '\t' : (primeira.split(';').length > primeira.split(',').length ? ';' : ',');
  const linhas = [];
  for (const l of txt.split(/\r?\n/)) {
    if (!l.trim()) continue;
    if (sep === '\t') { linhas.push(l.split('\t')); continue; }
    const cel = []; let atual = '', aspas = false;
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (c === '"') { if (aspas && l[i+1] === '"') { atual += '"'; i++; } else aspas = !aspas; }
      else if (c === sep && !aspas) { cel.push(atual); atual = ''; }
      else atual += c;
    }
    cel.push(atual); linhas.push(cel);
  }
  return linhas;
}
/* XML do Excel 2003 (SpreadsheetML) — formato da exportação "Listagem do Browse" do sistema */
function xmlParaTabelas(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Arquivo XML inválido.');
  const SS = 'urn:schemas-microsoft-com:office:spreadsheet', tabelas = [];
  for (const ws of doc.getElementsByTagNameNS(SS, 'Worksheet')) {
    const linhas = [];
    for (const row of ws.getElementsByTagNameNS(SS, 'Row')) {
      const L = [];
      for (const cell of row.getElementsByTagNameNS(SS, 'Cell')) {
        const idx = cell.getAttributeNS(SS, 'Index') || cell.getAttribute('ss:Index');
        if (idx) while (L.length < Number(idx) - 1) L.push(null);
        const d = cell.getElementsByTagNameNS(SS, 'Data')[0];
        const tipo = d && (d.getAttributeNS(SS, 'Type') || d.getAttribute('ss:Type'));
        const v = d ? d.textContent : null;
        L.push(v === null ? null : tipo === 'Number' ? Number(v) : v);
      }
      linhas.push(L);
    }
    tabelas.push({ nome:ws.getAttributeNS(SS, 'Name') || ws.getAttribute('ss:Name') || 'Planilha', linhas });
  }
  return tabelas;
}
function decodificar(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  const u = new TextDecoder('utf-8').decode(buf);
  return u.includes('�') ? new TextDecoder('windows-1252').decode(buf) : u;
}
async function lerTabelasArquivo(f) {
  const buf = await f.arrayBuffer();
  if (/\.xml$/i.test(f.name)) return xmlParaTabelas(decodificar(buf));
  if (/\.(txt|tsv|csv)$/i.test(f.name)) return [{ nome:'texto', linhas:textoParaLinhas(decodificar(buf)) }];
  const wb = XLSX.read(buf, { type:'array' });
  return wb.SheetNames.map(nome => ({ nome, linhas:XLSX.utils.sheet_to_json(wb.Sheets[nome], { header:1, raw:true, defval:null }) }));
}
function regsDeLinhas(linhas, soDescricao) {
  const cab = detectarCabecalho(linhas, soDescricao); if (!cab) return null;
  // data/hora do relatório (ex.: "Dt.Ref: 16/11/2026", "Hora: 08:15:22")
  let ref = '';
  for (let r = 0; r < cab.linha; r++) {
    const t = (linhas[r] || []).filter(Boolean).join(' ');
    const d = t.match(/Dt\.?\s*Ref\.?:?\s*(\d{2}\/\d{2}\/\d{4})/i), h = t.match(/Hora:?\s*(\d{2}:\d{2})/i);
    if (d) ref = d[1] + ref; if (h) ref = ref + ' ' + h[1];
  }
  const cabCod = cab.cab[cab.col.codigo], regs = [];
  let repetidos = 0;
  for (let r = cab.linha + 1; r < linhas.length; r++) {
    const L = linhas[r] || [], g = k => cab.col[k] === undefined ? null : L[cab.col[k]];
    const codigo = String(g('codigo') ?? '').trim(); if (!codigo) continue;
    if (norm(codigo) === cabCod) { repetidos++; continue; }                 // cabeçalho repetido a cada página
    if (!soDescricao && cab.col.sistema !== undefined && vazio(g('sistema'))) continue;   // linha de título / total
    regs.push({ codigo, descricao:String(g('descricao') ?? '').trim(), lote:String(g('lote') ?? '').trim(),
      validade:dataISO(g('validade')), fabricacao:dataISO(g('fabricacao')), data_ref:dataISO(g('data')),
      sistema:numero(g('sistema')), empenho:numero(g('empenho')),
      armazem:String(g('armazem') ?? '').trim(), armazemNome:cab.col.armazemNome !== undefined ? String(L[cab.col.armazemNome] ?? '').trim() : '',
      empresa:String(g('empresa') ?? '').trim() });
  }
  return { regs, ref:ref.trim(), repetidos, temDescricao:cab.col.descricao !== undefined };
}
function novaImportacao() { S.imp ??= { arquivos:[], agrupar:'codlote', armz:null, zerados:false }; }
const ARMAZEM = '11';   // só entra o armazém 11 – AMOSTRAS
const armz = a => String(a || '').replace(/^0+(?=\d\d)/, '');
function ajustarArmazens() {
  const todos = new Set(S.imp.arquivos.flatMap(a => a.abas.filter(x => x.usar).flatMap(x => x.regs.map(r => armz(r.armazem)))));
  S.imp.armz = todos.has(ARMAZEM) ? [ARMAZEM] : null;   // planilha sem coluna de armazém: entra tudo

async function lerArquivos(files) {

      (abas.find(a => norm(a.nome) === 'BASE') || abas.find(a => norm(a.nome) !== 'CONTAGEM') || abas[0]).usar = true;
      S.imp.arquivos.push({ nome:f.name, abas });

}

function linhasImportacao() {
  const imp = S.imp; if (!imp) return { brutas:[], finais:[], armazens:{}, zerados:0, semDesc:[] };
  let brutas = imp.arquivos.flatMap(a => a.abas.filter(x => x.usar).flatMap(x => x.regs));

  const descs = new Map(); brutas.forEach(r => { if (r.descricao) descs.set(norm(r.codigo), r.descricao); });
  const armazens = {};
  brutas.forEach(r => { const k = armz(r.armazem) || '(sem)'; armazens[k] ??= { n:0, nome:'' }; armazens[k].n++; if (!armazens[k].nome && r.armazemNome) armazens[k].nome = r.armazemNome; });
  if (imp.armz) brutas = brutas.filter(r => imp.armz.includes(armz(r.armazem)));
  const zerados = brutas.filter(r => !(r.sistema > 0)).length;
  if (!imp.zerados) brutas = brutas.filter(r => r.sistema > 0);
  brutas = brutas.map(r => ({ ...r, descricao:r.descricao || descs.get(norm(r.codigo)) || descDe(r.codigo) }));
  let finais;
  if (imp.agrupar === 'nao') finais = brutas.map(r => ({ ...r, n:1 }));
  else {
    const mapa = new Map();
    for (const r of brutas) {
      const k = imp.agrupar === 'cod' ? norm(r.codigo) : norm(r.codigo) + '¦' + norm(r.lote);
      const g = mapa.get(k);
      if (!g) { mapa.set(k, { ...r, n:1, lotes:new Set([r.lote]), arms:new Set([r.armazem]), nomes:new Set([r.armazemNome]) }); continue; }
      g.sistema = arred(g.sistema + r.sistema); g.empenho = arred(g.empenho + r.empenho); g.n++;
      g.lotes.add(r.lote); g.arms.add(r.armazem); g.nomes.add(r.armazemNome);
      if (!g.descricao && r.descricao) g.descricao = r.descricao;
      for (const c of ['validade','fabricacao','data_ref']) if (r[c] && (!g[c] || r[c] < g[c])) g[c] = r[c];
    }
    finais = [...mapa.values()].map(g => ({ ...g, lote:[...g.lotes].filter(Boolean).join(' / '),
      armazem:[...g.arms].filter(Boolean).join(' / '), armazemNome:[...g.nomes].filter(Boolean).join(' / ') }));
  }
  const semDesc = [...new Set(finais.filter(f => !f.descricao).map(f => f.codigo))];
  return { brutas, finais, armazens, zerados, semDesc, descs };
}

async function salvarBase() {
  const { finais, descs } = linhasImportacao(), imp = S.imp;
  if ((S.base || []).length && !await confirmar(`Substituir a base de dados atual (${S.base.length} lotes) por esta nova (${finais.length} lotes)?<br><br>Os inventários já abertos não mudam.`, 'Substituir')) return;
  const btn = $('btnSalvarBase'); btn.disabled = true;
  try {
    // guarda as descrições que vieram nos arquivos (o sistema "aprende")
    const novas = [...descs.entries()].filter(([c, d]) => d && descDe(c) !== d).map(([c, d]) => ({ codigo:c, descricao:d, atualizado_em:new Date().toISOString() }));
    for (let i = 0; i < novas.length; i += 500) {
      const { error } = await sb.from('inv_produtos').upsert(novas.slice(i, i + 500), { onConflict:'codigo' }); if (error) throw error;
    }
    let r = await sb.from('inv_base').delete().gt('id', 0); if (r.error) throw r.error;
    const refs = imp.arquivos.flatMap(a => a.abas.filter(x => x.usar).map(x => x.ref)).filter(Boolean);
    const origem = (imp.arquivos.map(a => a.nome).join(' + ') + (refs.length ? ` (ref. ${refs.join(', ')})` : '')).slice(0, 250);
    const agora = new Date().toISOString();
    const regs = finais.map(f => ({ codigo:f.codigo, descricao:f.descricao || null, lote:f.lote || null, armazem:f.armazem || null,
      armazem_nome:f.armazemNome || null, saldo:f.sistema, empenho:f.empenho || 0, data_ref:f.data_ref, validade:f.validade,
      fabricacao:f.fabricacao, origem, carregado_em:agora, carregado_por:S.perfil.nome }));
    for (let i = 0; i < regs.length; i += 500) {
      btn.textContent = `Salvando ${Math.min(i + 500, regs.length)} de ${regs.length}...`;
      r = await sb.from('inv_base').insert(regs.slice(i, i + 500)); if (r.error) throw r.error;
    }
    S.imp = null; await carregarBase(true);
    toast(`Base de dados salva: ${regs.length} lotes.`, 'ok'); pBase();
  } catch (e) { toast(erroMsg(e), 'erro'); btn.disabled = false; btn.textContent = 'Salvar como base de dados'; }
}

async function copiarBase(invId, linhas = S.base) {
  const regs = linhas.map((x, i) => ({ inventario_id:invId, ordem:i + 1, armazem:x.armazem, codigo:x.codigo, descricao:x.descricao,

  for (let i = 0; i < regs.length; i += 500) {

}

}

const FILTROS = [['todos','Todos'],['div','Com divergência'],['ok','Sem divergência'],['rec','Em recontagem'],['nao','Não contados'],['extra','Não listados'],['tr','Transferência']];
function filtroRel(lista, f = S.fRel) {
  return filtrar(lista, S.bRel).map(it => ({ it, c:calc(it) })).filter(({it, c}) => {
    switch (f) {
      case 'div': return c.concluido && c.diverg && !temTransf(it);
      case 'ok': return c.concluido && c.diverg === false;
      case 'rec': return c.emRec;
      case 'nao': return c.status === 'NÃO CONTADO';
      case 'extra': return it.extra;
      case 'tr': return temTransf(it);
      default: return true;
    }
  });
}

function serialExcel(iso) { if (!iso) return null; const [a,m,d] = iso.split('-').map(Number); return (Date.UTC(a,m-1,d) - Date.UTC(1899,11,30)) / 86400000; }
function estilizar(ws, nLin, nCol, opc = {}) {
  const borda = { style:'thin', color:{ rgb:'D5DCE6' } };
  for (let r = 0; r <= nLin; r++) for (let c = 0; c < nCol; c++) {
    const ref = XLSX.utils.encode_cell({ r, c }); if (!ws[ref]) ws[ref] = { t:'s', v:'' };
    const s = { border:{ top:borda, bottom:borda, left:borda, right:borda }, font:{ name:'Calibri', sz:10 }, alignment:{ vertical:'top' } };
    if (r === 0) { s.fill = { fgColor:{ rgb:'123163' } }; s.font = { name:'Calibri', sz:10, bold:true, color:{ rgb:'FFFFFF' } }; s.alignment = { vertical:'center', wrapText:true }; }
    else if (opc.cor && opc.cor[r-1]) s.fill = { fgColor:{ rgb:opc.cor[r-1] } };
    ws[ref].s = s;
  }
}
function exportarExcel() {
  const inv = invAtual(), r = estatisticas(), wb = XLSX.utils.book_new();
  const bold = { font:{ bold:true, color:{ rgb:'123163' } } };
  // Rosto
  const rosto = [['INVENTÁRIO DE AMOSTRA'], [], ['Inventário', inv.nome], ['Tipo', inv.tipo === 'parcial' ? 'PARCIAL (itens selecionados)' : 'GERAL'], ['Data da contagem', fmtData(inv.data_contagem)], ['Local', inv.local||''], ['Armazém', inv.armazem||''],
    ['Rua', inv.rua||''], ['Situação', inv.status === 'aberto' ? `ABERTO (${inv.rodada}ª contagem) — PRÉVIA` : 'FINALIZADO'], ['Finalizado em', inv.encerrado_em ? fmtDH(inv.encerrado_em) : ''],
    ['Planilha gerada em', new Date().toLocaleString('pt-BR')], ['Gerada por', S.perfil.nome], [], ['Supervisão', '', 'Assinatura:'], ['Gerência', '', 'Assinatura:']];
  const wsR = XLSX.utils.aoa_to_sheet(rosto); wsR['!cols'] = [{wch:22},{wch:42},{wch:24}];
  wsR['A1'].s = { font:{ bold:true, sz:16, color:{ rgb:'123163' } } };
  for (let i = 3; i <= 14; i++) if (wsR['A'+i]) wsR['A'+i].s = bold;
  XLSX.utils.book_append_sheet(wb, wsR, 'Rosto');

  // Contagem (confronto)
  const cab = ['EMP.','ARMZ.','SKU','DESCRIÇÃO','LOTE','VAL.','SISTEMA','1º CONT.','1º CONTOU','2º CONT.','2º CONTOU','3º CONT.','3º CONTOU','4º CONT.','4º CONTOU',
    'COMPARATIVO','DIVERGÊNCIA','RECONTAGEM','DIFERENÇA','DISPOSIÇÃO','SALDO FINAL','NÃO LISTADO','TRANS. PARA LOCAL','COMENTÁRIOS'];
  const cores = [], linhas = S.itens.map(it => {
    const c = calc(it);
    cores.push({ 'r-ok':COR.ok, 'r-neg':COR.neg, 'r-pos':COR.pos, 'r-rec':COR.rec, 'r-tr':COR.tr }[c.cls] || null);
    return [it.empresa||'', it.armazem||'', it.codigo, it.descricao||'', it.lote||'', serialExcel(it.validade), Number(it.sistema),
      num(it.c1), it.c1_por||'', num(it.c2), it.c2_por||'', num(it.c3), it.c3_por||'', num(it.c4), it.c4_por||'',
      c.status, c.diverg === null ? '' : c.diverg ? 'SIM' : 'NÃO', c.recontado ? 'SIM' : 'NÃO', c.dif, c.disp, c.final, it.extra ? 'SIM' : '', it.transf_local||'', it.comentario||''];
  });
  const wsC = XLSX.utils.aoa_to_sheet([cab, ...linhas]);
  estilizar(wsC, linhas.length, cab.length, { cor:cores });
  for (let i = 1; i <= linhas.length; i++) { const ref = XLSX.utils.encode_cell({ r:i, c:5 }); if (wsC[ref] && wsC[ref].t === 'n') wsC[ref].z = 'dd/mm/yyyy'; }
  wsC['!cols'] = [6,6,11,40,13,10,9,8,16,8,16,8,16,8,16,14,11,11,10,13,10,10,14,30].map(w => ({ wch:w }));
  wsC['!autofilter'] = { ref:XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:linhas.length, c:cab.length-1} }) };
  wsC['!freeze'] = { xSplit:0, ySplit:1 }; wsC['!views'] = [{ state:'frozen', ySplit:1 }];
  XLSX.utils.book_append_sheet(wb, wsC, 'Contagem');

  // Lançamentos
  const porId = new Map(S.itens.map(i => [i.id, i]));
  const cabL = ['DATA/HORA','QUEM','CONTAGEM','SKU','DESCRIÇÃO','LOTE','TIPO DATA','DATA INFORMADA','DATA NO SISTEMA','CONFERE DATA','QUANTIDADE','SITUAÇÃO','CANCELADO POR'];
  const linL = [...S.lanc].sort((a,b) => a.id - b.id).map(l => { const it = porId.get(l.item_id); const dSis = it ? (l.tipo_data === 'F' ? it.fabricacao : it.validade) : null;
    return [fmtDH(l.em), l.por||'', l.rodada + 'ª', l.codigo, l.descricao||'', l.lote||'', l.tipo_data === 'F' ? 'FABRICAÇÃO' : 'VALIDADE', fmtData(l.data), fmtData(dSis), dSis && l.data ? (dSis === l.data ? 'SIM' : 'NÃO') : '', Number(l.quantidade), l.cancelado ? 'CANCELADO' : 'VÁLIDO', l.cancelado ? `${l.cancelado_por||''} ${fmtDH(l.cancelado_em)}` : '']; });
  const wsL = XLSX.utils.aoa_to_sheet([cabL, ...linL]); estilizar(wsL, linL.length, cabL.length);
  wsL['!cols'] = [15,20,10,11,40,13,12,14,16,12,11,12,24].map(w => ({ wch:w }));
  XLSX.utils.book_append_sheet(wb, wsL, 'Lançamentos');

  // Estatística
  const pessoas = Object.entries(r.pessoas).sort((a,b) => b[1].itens - a[1].itens);
  const est = [['AJUSTE POSITIVO','AJUSTE NEGATIVO','TRANSFERÊNCIA','TOTAL DE LINHAS','SEM DIVERGÊNCIA','ESTOQUE DIVERGENTE','ACURACIDADE'],
    [r.pos, r.neg, r.tr, r.total, r.ok, r.pos + r.neg, r.acur]];
  const wsE = XLSX.utils.aoa_to_sheet(est); estilizar(wsE, 1, 7); wsE['G2'].z = '0.0%';
  XLSX.utils.sheet_add_aoa(wsE, [['QTD. AJUSTE POSITIVO (UN.)', r.qPos], ['QTD. AJUSTE NEGATIVO (UN.)', r.qNeg], ['NÃO LISTADOS NO RELATÓRIO', r.extras]], { origin:'A4' });
  XLSX.utils.sheet_add_aoa(wsE, [['CONTAGENS','1ª','2ª','3ª','4ª'], ['Linhas', ...r.linhas], ['Contadas', ...r.cont]], { origin:'A8' });
  XLSX.utils.sheet_add_aoa(wsE, [['QUEM CONTOU','LANÇAMENTOS','ITENS','DIVERGIRAM DO SISTEMA'], ...pessoas.map(([n,p]) => [n, p.lanc.reduce((a,b)=>a+b,0), p.itens, p.div])], { origin:'A12' });
  ['A4','A5','A6','A8','A12','B8','C8','D8','E8','B12','C12','D12'].forEach(c => { if (wsE[c]) wsE[c].s = bold; });
  wsE['!cols'] = Array(7).fill({ wch:22 });
  XLSX.utils.book_append_sheet(wb, wsE, 'Estatística');

  const nome = inv.nome.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_');
  XLSX.writeFile(wb, `Inventario_${nome}${inv.status === 'aberto' ? '_PREVIA' : ''}.xlsx`);
}
function imprimir() {
  const inv = invAtual(), r = estatisticas(), pessoas = Object.entries(r.pessoas).sort((a,b) => b[1].itens - a[1].itens);
  const cel = (it,k) => vazio(it['c'+k]) ? '' : `${fmtN(it['c'+k])}<br><small>${esc(it['c'+k+'_por'])}</small>`;
  const cab = `<div style="display:flex;justify-content:space-between;border-bottom:2px solid #123163;padding-bottom:6px;margin-bottom:10px">
    <b style="color:#123163;font-size:15px">Inventário de Amostra · ${esc(inv.nome)}</b><span style="font-size:10px">Gerado em ${new Date().toLocaleString('pt-BR')} por ${esc(S.perfil.nome)}</span></div>`;
  $('print-area').innerHTML = `
  <div class="pg" style="font-family:Arial,sans-serif">
    <div style="background:#2850f0;padding:24px;border-radius:10px;text-align:center"><img src="${LOGO}" style="height:90px"></div>
    <h1 style="color:#123163;text-align:center;margin:20px 0 4px">Inventário de Amostra</h1><div style="text-align:center;font-size:16px">${esc(inv.nome)}</div>
    <table style="width:60%;margin:22px auto;font-size:13px">
      <tr><td><b>Data da contagem</b></td><td>${fmtData(inv.data_contagem)}</td></tr><tr><td><b>Local / Armazém / Rua</b></td><td>${esc(inv.local||'')} / ${esc(inv.armazem||'')} / ${esc(inv.rua||'')}</td></tr>
      <tr><td><b>Situação</b></td><td>${inv.status === 'aberto' ? `Aberto (${inv.rodada}ª contagem)` : 'Finalizado em ' + fmtDH(inv.encerrado_em)}</td></tr></table>
    <table style="width:85%;margin:8px auto;font-size:12px;text-align:center"><tr><th>Total de linhas</th><th>Sem divergência</th><th>Ajuste negativo</th><th>Ajuste positivo</th><th>Transferência</th><th>Acuracidade</th></tr>
      <tr><td>${r.total}</td><td>${r.ok}</td><td>${r.neg} (${fmtN(r.qNeg)} un.)</td><td>${r.pos} (+${fmtN(r.qPos)} un.)</td><td>${r.tr}</td><td><b>${fmtPct(r.acur)}</b></td></tr></table>
    <table style="width:55%;margin:14px auto;font-size:11px"><tr><th>Quem contou</th><th>Lançamentos</th><th>Itens</th><th>Divergiram</th></tr>
      ${pessoas.map(([n,p]) => `<tr><td>${esc(n)}</td><td>${p.lanc.reduce((a,b)=>a+b,0)}</td><td>${p.itens}</td><td>${p.div}</td></tr>`).join('')}</table>
    <div style="display:flex;gap:40px;justify-content:center;margin-top:50px;font-size:12px">
      ${['Supervisão','Gerência'].map(t => `<div style="text-align:center;width:250px"><div style="border-top:1px solid #000;padding-top:4px">${t}</div>
        <div style="margin-top:6px;font-size:10px">Data: ____/____/______ &nbsp; Horário término: ____:____</div></div>`).join('')}</div>
  </div>
  <div class="pg" style="font-family:Arial,sans-serif">${cab}
    <table><thead><tr><th>SKU</th><th>Descrição</th><th>Lote</th><th>Val.</th><th>Sistema</th><th>1ª cont.</th><th>2ª cont.</th><th>3ª cont.</th><th>4ª cont.</th>
      <th>Status</th><th>Diverg.</th><th>Dif.</th><th>Disposição</th><th>Saldo final</th></tr></thead><tbody>
    ${S.itens.map(it => { const c = calc(it); return `<tr class="${c.cls}"><td>${esc(it.codigo)}</td><td>${esc(it.descricao)}</td><td>${esc(it.lote)}</td><td>${fmtData(it.validade)}</td>
      <td class="n">${fmtN(it.sistema)}</td>${[1,2,3,4].map(k=>`<td class="n">${cel(it,k)}</td>`).join('')}<td>${esc(c.status)}</td><td>${c.diverg === null ? '' : c.diverg ? 'SIM' : 'NÃO'}</td>
      <td class="n">${c.dif === null ? '' : fmtN(c.dif)}</td><td>${esc(c.disp)}</td><td class="n">${fmtN(c.final)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  setTimeout(() => window.print(), 300);
}

/* =====================================================================
   USUÁRIOS (administrador)
   ===================================================================== */
async function pUsuarios() {
  $('view').innerHTML = `<div class="page">
    <div class="card"><h3>Novo usuário</h3>
      <div class="linha">
        <div class="campo"><label>Nome</label><input id="nuNome" placeholder="Nome completo"></div>
        <div class="campo"><label>Usuário (para entrar)</label><input id="nuLogin" placeholder="ex.: maria.silva" autocapitalize="none"></div>
        <div class="campo"><label>Senha</label><input id="nuSenha" placeholder="mínimo 6 caracteres"></div>
        <div class="campo" style="max-width:190px"><label>Perfil</label><select id="nuPerfil"><option value="contador">Contagem</option><option value="admin">Administrador</option></select></div>
        <button class="btn" id="nuOk">Cadastrar</button>
      </div>
      <div class="peq" style="margin-top:10px"><b>Contagem</b>: só lança as contagens (não vê quantidades do sistema nem relatórios). · <b>Administrador</b>: vê tudo, acompanha, exporta e cadastra usuários.</div>
    </div>
    <div class="card"><div id="tabUsu" class="vazio">Carregando...</div></div></div>`;
  $('nuNome').oninput = () => { if (!$('nuLogin')._mexido) $('nuLogin').value = slugLogin($('nuNome').value.split(' ').filter(Boolean).slice(0,2).join(' ')); };
  $('nuLogin').oninput = () => $('nuLogin')._mexido = true;
  $('nuOk').onclick = criarUsuario;
  await listarUsuarios();
}
async function listarUsuarios() {
  const { data, error } = await sb.from('inv_perfis').select('*').order('nome', {ascending:true});
  if (error) return toast(erroMsg(error), 'erro');
  S.usuarios = data; const el = $('tabUsu'); if (!el) return; el.className = '';
  el.innerHTML = `<div class="tabela"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Situação</th><th>Criado em</th><th></th></tr></thead><tbody>
    ${data.map(u => `<tr><td><b>${esc(u.nome)}</b></td><td>${esc(u.login)}</td>
      <td><select onchange="mudarPerfil('${u.id}', this.value)" ${u.id === S.perfil.id ? 'disabled' : ''}>
        ${Object.entries(NOME_PERFIL).map(([k,n]) => `<option value="${k}" ${u.perfil===k?'selected':''}>${n}</option>`).join('')}</select></td>
      <td>${u.ativo ? '<span class="tag t-ok">Ativo</span>' : '<span class="tag t-neg">Bloqueado</span>'}</td><td>${fmtDH(u.criado_em)}</td>
      <td style="white-space:nowrap">${u.id === S.perfil.id ? '<span class="peq">(você)</span>' : `
        <button class="btn secondary small" onclick="bloquear('${u.id}', ${!u.ativo})">${u.ativo ? 'Bloquear' : 'Desbloquear'}</button>
        <button class="btn secondary small" onclick="novaSenha('${u.id}')">Nova senha</button>
        <button class="btn perigo small" onclick="apagarUsuario('${u.id}')">Apagar</button>`}</td></tr>`).join('')}
    </tbody></table></div>`;
}
async function criarUsuario() {
  const nome = $('nuNome').value.trim(), login = slugLogin($('nuLogin').value), senha = $('nuSenha').value;
  if (!nome || !login) return toast('Informe o nome e o usuário.', 'erro');
  if (senha.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', 'erro');
  $('nuOk').disabled = true;
  const { error } = await sb.rpc('inv_criar_usuario', { p_login:login, p_senha:senha, p_nome:nome, p_perfil:$('nuPerfil').value });
  $('nuOk').disabled = false;
  if (error) return toast(erroMsg(error), 'erro');
  toast(`Usuário “${login}” cadastrado.`, 'ok');
  ['nuNome','nuLogin','nuSenha'].forEach(i => $(i).value = ''); $('nuLogin')._mexido = false;
  listarUsuarios();
}
async function mudarPerfil(id, perfil) {
  const { error } = await sb.from('inv_perfis').update({ perfil }).eq('id', id);
  if (error) toast(erroMsg(error), 'erro'); else toast('Perfil alterado.', 'ok');
  listarUsuarios();
}
async function bloquear(id, ativo) {
  const { error } = await sb.from('inv_perfis').update({ ativo }).eq('id', id);
  if (error) return toast(erroMsg(error), 'erro');
  toast(ativo ? 'Usuário desbloqueado.' : 'Usuário bloqueado.', 'ok'); listarUsuarios();
}
function novaSenha(id) {
  const u = S.usuarios.find(x => x.id === id);
  abrirModal(`<h3>Nova senha · ${esc(u.nome)}</h3>
    <div class="campo"><label>Nova senha</label><input id="rsS" autofocus></div>
    <div class="modal-acoes"><button class="btn secondary" onclick="fecharModal()">Cancelar</button><button class="btn" id="rsOk">Salvar</button></div>`);
  $('rsOk').onclick = async () => {
    const s = $('rsS').value; if (s.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', 'erro');
    const { error } = await sb.rpc('inv_resetar_senha', { p_uid:id, p_senha:s });
    if (error) return toast(erroMsg(error), 'erro');
    fecharModal(); toast('Senha alterada.', 'ok');
  };
}
async function apagarUsuario(id) {
  const u = S.usuarios.find(x => x.id === id);
  if (!await confirmar(`Apagar o usuário <b>${esc(u.nome)}</b>? Os lançamentos dele continuam no histórico.`, 'Apagar', true)) return;
  const { error } = await sb.rpc('inv_apagar_usuario', { p_uid:id });
  if (error) return toast(erroMsg(error), 'erro');
  toast('Usuário apagado.', 'ok'); listarUsuarios();
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) fecharModal(); });
(async () => {
  try {
    const { data } = await sb.auth.getSession();
    if (data?.session?.user) await iniciarSessao(data.session.user);
  } catch (e) { const m = $('authMsg'); m.className = 'auth-msg err'; m.textContent = erroMsg(e); }
})();
</script>
